<!doctype html>
<html lang="es">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
 <meta name="theme-color" content="#0b0a11">
 <title>Reta · Insert Coin MX</title>
 <meta name="robots" content="noindex">
 <meta name="description" content="Elige tu diseño favorito en siete enfrentamientos. Tu campeona vuelve mañana.">
 <link rel="preload" as="image" href="d/gatosamurai.webp">
 <link rel="preload" as="image" href="d/x.webp">
 <link rel="stylesheet" href="reta.css">
</head>
<body>
 <main class="app" id="app">
  <header class="brandbar">
   <div class="brand">
    <img src="coin.png" alt="">
    <span class="brandword">Reta<small>EL ÁLBUM</small></span>
   </div>
   <div class="minictrls">
    <button type="button" class="tinybtn" id="mute" aria-label="Silenciar sonido" aria-pressed="false" title="Sonido">♫</button>
    <button type="button" class="tinybtn" id="reset" aria-label="Reiniciar la prueba" title="Reiniciar">↻</button>
   </div>
  </header>

  <section class="hud" aria-label="Progreso">
   <div class="hud-line">
    <div class="hud-title">STAGE <b>01</b></div>
    <div class="hud-meta"><span id="roundNum">01</span> / 07<br>ENCUENTROS</div>
   </div>
   <div class="progress" id="pips" aria-hidden="true"></div>
  </section>

  <div class="prompt"><strong>¿CON CUÁL FARMEAS MÁS AURA?</strong></div>

  <section class="arena" id="arena" aria-label="Enfrentamiento de playeras">
   <div class="slot" id="topWrap"></div>
   <div class="vs-divider" aria-label="Comparación de diseños"><span class="duel-name duel-left" id="duelTop">Gato Samurái</span><b aria-hidden="true">VS</b><span class="duel-name duel-right" id="duelBottom">X</span></div>
   <div class="slot" id="bottomWrap"></div>
  </section>

  
  <div class="shock" id="shock" aria-hidden="true"><span id="impactText">HIT!</span></div>

  <div class="intro" aria-hidden="true">
   <small>HERE COMES A</small>
   <strong>NEW<br>CHALLENGER!</strong>
  </div>

  <section class="winner-screen" id="finish" aria-hidden="true" aria-label="Resultado de la Reta" role="dialog" aria-modal="true" data-origin="top">
   <div class="winner-bg" id="winnerBg" aria-hidden="true"></div>
   <div class="winner-status"><span>07 / 07</span><span class="status-rule"></span><span>RETA COMPLETADA</span></div>
   <button type="button" class="winner-retry" id="again" aria-label="Repetir demo" title="Repetir">↻</button>
   <div class="winner-scene">
    <div class="winner-tableau">
     <div class="winner-type" aria-label="Winner is"><span class="winner-type-main">WINNER</span><span class="winner-type-sticker">IS...</span></div>
     <div class="winner-halo" aria-hidden="true"></div>
     <div class="winner-echo echo-left" id="winnerEchoLeft" aria-hidden="true"></div>
     <div class="winner-echo echo-right" id="winnerEchoRight" aria-hidden="true"></div>
     <div class="winner-shirt" id="winnerShirt" aria-hidden="true"></div>
    </div>
    <div class="winner-caption">
     <h2 class="winner-name" id="winnerName">Gato Samurái</h2>
     <div class="winner-result">
      <span id="winnerStatus">TU NUEVA CAMPEONA</span>
      <p id="winnerFuture">Mañana podrás defenderla.</p>
      <p class="winner-pack-note" id="winnerPackNote" hidden></p>
     </div>
    </div>
   </div>
   <a class="winner-next" href="https://insertcoinmx.com/">DESCUBRE MÁS DISEÑOS EN SOBRES</a>
  </section>
 </main>

 <script src="reta-diaria.js"></script>
</body>
</html>
