<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Insert Coin MX · El Álbum</title><style>
@font-face{font-family:PX;src:url(ps2p.ttf)}
:root{--y:#FFD400;--ink:#f3f1ff;--dim:#8b88b8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07060b;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.px{font-family:PX,monospace}
.crt{position:fixed;inset:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));border:10px solid #000;border-radius:26px/34px;background:radial-gradient(120% 100% at 50% 40%,#1a1666 0,#0c0b2a 68%,#05041a 100%);box-shadow:0 0 0 4px #2b2536,0 0 46px rgba(80,90,255,.3),inset 0 0 80px rgba(0,0,0,.8);overflow:hidden}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);z-index:1}
.view{position:absolute;inset:0;display:none;flex-direction:column;z-index:2}
.view.on{display:flex}
.view>.top{display:flex;align-items:center;gap:10px;padding:14px 16px;font-family:PX;font-size:10px;color:var(--y)}
.view>.top .sp{flex:1}
.btn{font-family:PX;font-size:10px;padding:10px 12px;border:2px solid rgba(255,255,255,.45);background:rgba(0,0,0,.25)}
.btn.y{background:var(--y);color:#000;border-color:var(--y)}
.big{font-family:PX;font-size:14px;padding:18px 26px;background:var(--y);color:#000;box-shadow:0 6px 0 #a88a00}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #a88a00}
.blink{animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:0}}
/* inicio */
#home{align-items:center;text-align:center;padding:18px}
.hud{display:flex;justify-content:space-between;width:100%;font-family:PX;font-size:9px;line-height:1.9}.hud b{color:var(--y);font-weight:400;display:block}
.fan{position:relative;width:300px;height:250px;margin:16px 0 6px}
.fan img{position:absolute;width:150px;border-radius:9px;box-shadow:0 14px 26px rgba(0,0,0,.6)}
.title{font-family:PX;font-size:clamp(22px,7vw,36px);color:var(--y);line-height:1.25;text-shadow:0 0 18px rgba(255,212,0,.5)}
.rib{display:inline-block;background:#e8323c;color:#fff;font-family:PX;font-size:10px;padding:8px 16px 7px;margin-top:12px;box-shadow:0 3px 0 #000}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:22px;width:min(320px,100%)}
.menu .btn{font-size:11px;padding:14px;text-align:left;display:flex;justify-content:space-between}
/* sobre */
#pack .stage{touch-action:none;flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.env{width:230px;height:330px;position:relative;cursor:pointer;filter:drop-shadow(0 26px 30px rgba(0,0,0,.6));animation:wob 2.4s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-3deg) translateY(-6px)}}
.env .foil{position:absolute;inset:0;background:conic-gradient(from 210deg,#ffd400,#ff9edc,#8fe9ff,#c6ff8a,#fff3a0,#ffb36b,#ffd400);clip-path:polygon(0 3%,5% 0,10% 3%,15% 0,20% 3%,25% 0,30% 3%,35% 0,40% 3%,45% 0,50% 3%,55% 0,60% 3%,65% 0,70% 3%,75% 0,80% 3%,85% 0,90% 3%,95% 0,100% 3%,100% 97%,95% 100%,90% 97%,85% 100%,80% 97%,75% 100%,70% 97%,65% 100%,60% 97%,55% 100%,50% 97%,45% 100%,40% 97%,35% 100%,30% 97%,25% 100%,20% 97%,15% 100%,10% 97%,5% 100%,0 97%)}
.env .in{position:absolute;inset:16px 12px;background:#0d0d14;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.env.rip{animation:rip .5s forwards}@keyframes rip{to{transform:scale(1.2);opacity:0}}
.deal{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.deal.on{display:flex}
.cardv{width:min(300px,70vw);aspect-ratio:480/670;perspective:1000px;cursor:pointer}
.flip{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.open{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.face img{width:100%;height:100%;display:block}
.back{background:#0c0b2a;border:3px solid var(--y);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background-image:repeating-linear-gradient(45deg,rgba(255,212,0,.08) 0 10px,transparent 10px 20px)}
.back img{width:90px}
.front{transform:rotateY(180deg)}
.tag{font-family:PX;font-size:11px;color:var(--y);min-height:14px}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2)}.dots i.on{background:var(--y)}
/* álbum */
#album .wrap{flex:1;overflow:auto;padding:0 14px 20px}
.tabs{display:flex;gap:8px;padding:0 14px 10px}
.tabs .btn.on{background:var(--y);color:#000;border-color:var(--y)}
.prog{margin:0 14px 12px;height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--y)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.slot{aspect-ratio:480/670;border-radius:10px;border:2px dashed rgba(255,212,0,.35);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;position:relative;overflow:hidden;cursor:pointer}
.slot.have{border:0}
.slot img{width:100%;height:100%;display:block}
.slot .no{font-family:PX;font-size:9px;color:rgba(255,212,0,.6)}
.slot .x{position:absolute;right:4px;top:4px;background:#e8323c;color:#fff;font-family:PX;font-size:8px;padding:3px 4px;border-radius:3px}
/* récords */
#scores .wrap{flex:1;overflow:auto;padding:0 16px 20px;display:flex;flex-direction:column;align-items:center;gap:16px}
.ini{display:flex;gap:10px}
.ini div{text-align:center}.ini b{display:flex;width:60px;height:76px;align-items:center;justify-content:center;font-family:PX;font-size:30px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.3);margin:6px 0}
.ini button{font-family:PX;font-size:12px;color:var(--y);padding:4px 16px}
.tbl{width:min(420px,100%);font-family:PX;font-size:11px}
.tbl .r{display:flex;gap:10px;padding:10px 6px;border-bottom:1px solid rgba(255,255,255,.12)}.tbl .r.me{color:var(--y)}
.tbl .r span:nth-child(1){width:40px}.tbl .r span:nth-child(2){flex:1;letter-spacing:.2em}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.zoom.on{display:flex}.zoom img{max-height:88vh;max-width:92vw;border-radius:16px}
.toast{position:fixed;left:50%;top:14%;transform:translate(-50%,-50%);font-family:PX;font-size:16px;color:var(--y);text-shadow:0 0 14px rgba(255,212,0,.6);opacity:0;pointer-events:none;z-index:60;text-align:center;line-height:1.6}
.toast.go{animation:t 1.4s}@keyframes t{15%,75%{opacity:1}}

.btn.lock.off{opacity:.45}
.lk{font-size:8px}
/* tier */
#tier .board{flex:1;overflow:auto;padding:0 12px 8px;display:flex;flex-direction:column;gap:6px}
.trow{display:flex;min-height:70px;border:2px solid rgba(255,255,255,.15);background:rgba(0,0,0,.25)}
.trow.hot{border-color:var(--y)}
.trow .lab{width:74px;flex:none;display:flex;align-items:center;justify-content:center;font-family:PX;font-size:10px;color:#000}
.trow .z{flex:1;display:flex;flex-wrap:wrap;gap:4px;padding:4px}
.chip{width:46px;aspect-ratio:480/670;border-radius:4px;overflow:hidden;cursor:pointer;flex:none}
.chip img{width:100%;height:100%;display:block}
.chip{touch-action:none;-webkit-user-select:none;user-select:none}.chip img{pointer-events:none;-webkit-user-drag:none}
.chip.ghost{position:fixed;z-index:99;transform:translate(-50%,-60%) rotate(-4deg);pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.6);outline:2px solid var(--y)}
.tray.hot{outline:2px solid var(--y)}
.tray .chip{touch-action:pan-x}
.chip.sel{outline:3px solid var(--y);outline-offset:1px}
.tray{border-top:2px dashed rgba(255,212,0,.5);padding:8px 12px 12px;background:rgba(0,0,0,.3)}
.tray .h{font-family:PX;font-size:8px;color:var(--y);margin-bottom:6px}
.tray .z{display:flex;gap:6px;overflow-x:auto;min-height:66px}
/* torneo */
#torneo .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 12px}
.vs{display:flex;align-items:center;gap:6px;max-width:100%}
.vs .c{width:min(36vw,190px);cursor:pointer;transition:transform .15s}
.vs .c img{width:100%;border-radius:10px;display:block;box-shadow:0 12px 24px rgba(0,0,0,.6)}
.vs .c:active{transform:scale(.96)}
.vs .c.ko{opacity:.25;transform:scale(.9)}
.vstxt{font-family:PX;font-size:16px;color:var(--y);text-shadow:3px 3px 0 #b33a00}
.rnd{font-family:PX;font-size:11px;color:var(--y)}

.env{width:240px;height:auto;animation:wob 2.6s ease-in-out infinite;filter:drop-shadow(0 24px 28px rgba(0,0,0,.6))}
.env .foil,.env .in{display:none}
.pk{width:240px;aspect-ratio:240/380;display:flex;flex-direction:column;position:relative}
.pk-top,.pk-bot{height:34px;flex:none;background:repeating-linear-gradient(90deg,#c9a400 0 3px,#ffd400 3px 6px);position:relative}
.pk-top{clip-path:polygon(0 0,4% 18%,8% 0,12% 18%,16% 0,20% 18%,24% 0,28% 18%,32% 0,36% 18%,40% 0,44% 18%,48% 0,52% 18%,56% 0,60% 18%,64% 0,68% 18%,72% 0,76% 18%,80% 0,84% 18%,88% 0,92% 18%,96% 0,100% 18%,100% 100%,0 100%);display:flex;align-items:center;justify-content:center;border-bottom:2px dashed #000}
.pk-top span{font-family:PX;font-size:8px;color:#000;margin-top:6px}
.pk-bot{clip-path:polygon(0 0,100% 0,100% 82%,96% 100%,92% 82%,88% 100%,84% 82%,80% 100%,76% 82%,72% 100%,68% 82%,64% 100%,60% 82%,56% 100%,52% 82%,48% 100%,44% 82%,40% 100%,36% 82%,32% 100%,28% 82%,24% 100%,20% 82%,16% 100%,12% 82%,8% 100%,4% 82%,0 100%)}
.pk-body{flex:1;position:relative;overflow:hidden;background:linear-gradient(160deg,#1b2a8f,#2f5fd6 45%,#6b3fb8);display:flex;flex-direction:column;align-items:center;padding:12px 10px}
.pk-body::before{content:"";position:absolute;inset:0;background:conic-gradient(from 200deg at 35% 30%,rgba(255,225,74,.25),rgba(255,158,220,.25),rgba(143,233,255,.25),rgba(198,255,138,.25),rgba(255,225,74,.25));mix-blend-mode:screen}
.pk-body::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 45%,rgba(255,255,255,.35) 49%,transparent 53%);animation:sh 3s linear infinite}
@keyframes sh{from{transform:translateX(-30%)}to{transform:translateX(30%)}}
.pk-brand{display:flex;align-items:center;gap:6px;z-index:1}.pk-brand img{height:16px;width:auto}.pk-brand span{font-family:PX;font-size:8px;color:#fff}
.pk-peek{position:relative;width:100%;height:150px;margin-top:10px;z-index:1}
.pk-peek img{position:absolute;width:96px;height:auto;aspect-ratio:480/670;object-fit:cover;border-radius:6px;box-shadow:0 8px 14px rgba(0,0,0,.5);bottom:-20px}
.pk-peek img:nth-child(1){left:50%;transform:translateX(-50%);z-index:3;width:108px}
.pk-peek img:nth-child(2){left:10px;transform:rotate(-12deg)}
.pk-peek img:nth-child(3){right:10px;transform:rotate(12deg)}
.pk-txt{margin-top:auto;text-align:center;z-index:1;display:flex;flex-direction:column;gap:6px;background:rgba(0,0,0,.55);padding:10px 12px;border-radius:8px;width:100%}
.pk-txt b{font-family:PX;font-size:18px;color:var(--y);font-weight:400}
.pk-txt span{font-family:PX;font-size:8px;color:#fff}
.pk-txt small{font-family:PX;font-size:6px;color:#cfcbe8}
.env.rip .pk-top{animation:tear .35s forwards}@keyframes tear{to{transform:translate(40px,-60px) rotate(18deg);opacity:0}}
/* reverso */
.back{background:#0c0b2a!important;border:4px solid var(--y)!important;background-image:none!important}
.bk{position:absolute;inset:10px;border-radius:10px;border:2px solid rgba(255,212,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 45%,rgba(255,212,0,.18),transparent 60%),repeating-linear-gradient(45deg,rgba(255,212,0,.07) 0 8px,transparent 8px 16px)}
.bk-coin{width:42%;aspect-ratio:1;border-radius:50%;background:var(--y);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px #0c0b2a,0 0 0 9px var(--y)}
.bk-coin img{width:62%;height:auto;filter:invert(1)}
.bk span{color:var(--y);font-size:11px;text-align:center;line-height:1.6}

.back{border:0!important;background:#FFD400!important;padding:8px}
.bk2{position:absolute;inset:8px;border-radius:10px;overflow:hidden;background:#1b2a8f;display:flex;align-items:center;justify-content:center}
.bk2 .rays{position:absolute;left:50%;top:46%;width:220%;aspect-ratio:1;transform:translate(-50%,-50%);background:repeating-conic-gradient(#2f5fd6 0 8deg,#1f3fb0 8deg 20deg)}
.bk2::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.25) 1px,transparent 1.5px);background-size:6px 6px;-webkit-mask:radial-gradient(circle at 50% 46%,transparent 35%,#000 80%);mask:radial-gradient(circle at 50% 46%,transparent 35%,#000 80%)}
.emb{position:absolute;left:50%;top:46%;width:72%;transform:translate(-50%,-50%);z-index:2;filter:drop-shadow(0 8px 0 rgba(0,0,0,.35))}
.face img.emb-logo{position:absolute;left:50%;top:46%;width:30%!important;height:auto!important;transform:translate(-50%,-50%);z-index:3;filter:invert(1)}
.plate{position:absolute;left:50%;bottom:9%;transform:translateX(-50%) rotate(-4deg);z-index:3;background:#e8323c;color:#fff;font-family:PX;font-size:10px;padding:8px 12px 7px;white-space:nowrap;box-shadow:3px 3px 0 #0c0b2a;border:2px solid #0c0b2a}
.st{position:absolute;font-style:normal;color:#FFD400;font-size:14px;z-index:3}
.s1{left:8px;top:6px}.s2{right:8px;top:6px}.s3{left:8px;bottom:6px}.s4{right:8px;bottom:6px}

.back{background:#FFD400!important;padding:0!important}
.bkA{position:absolute;inset:10px;border-radius:8px;background:#16151a;overflow:hidden}
.bkA::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,212,0,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,212,0,.06) 1px,transparent 1px);background-size:14px 14px}
.bkA .ln{position:absolute;inset:12px;border:2px solid rgba(255,212,0,.4);border-radius:6px}
.face .bkA img{position:absolute;left:50%;top:50%;width:62%!important;height:auto!important;transform:translate(-50%,-50%)}

.env{display:flex;flex-direction:column;align-items:center;animation:none;width:auto;filter:none}
.pk{animation:wob 2.6s ease-in-out infinite;filter:drop-shadow(0 24px 28px rgba(0,0,0,.6))}
.pk-top{cursor:grab;touch-action:none;-webkit-user-select:none}
.cutl{position:absolute;left:6%;right:6%;top:58%;border-top:3px dashed #000}
.cutp{position:absolute;left:6%;top:calc(58% - 4px);height:8px;width:0;background:#fff;box-shadow:0 0 12px #fff,0 0 24px var(--y);border-radius:4px}
.hand{position:absolute;top:22%;left:4%;font-size:26px;animation:hand 2s ease-in-out infinite;pointer-events:none}
@keyframes hand{0%{left:4%;opacity:0}15%{opacity:1}80%{left:82%;opacity:1}100%{left:86%;opacity:0}}
.env.cut .pk-top{animation:tear .4s forwards}
.stack{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
.stack.on{display:flex}
.sc{-webkit-user-select:none;-webkit-touch-callout:none;position:absolute;width:min(300px,72vw);aspect-ratio:480/670;border-radius:16px;touch-action:none;cursor:grab;transition:transform .3s,opacity .3s;user-select:none}
.sc>img{width:100%;height:100%;border-radius:16px;display:block;pointer-events:none;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.sc .bkc{position:absolute;inset:0;border-radius:16px;background:#FFD400;display:none}
.sc.down .bkc{display:block}
.sc.down.top{box-shadow:0 0 0 4px var(--g),0 0 50px 12px var(--g);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--g),0 0 80px 22px var(--g)}}
.sc .bkc .bkA img{position:absolute;left:50%;top:50%;width:62%;height:auto;transform:translate(-50%,-50%)}
.sc:not(.top) .badge{display:none}
.sc .badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-family:PX;font-size:10px;padding:6px 10px;background:var(--y);color:#000;white-space:nowrap;z-index:2}
.sc.down .badge{display:none}
.sum{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 12px}
.sum.on{display:flex}
.sum .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(360px,100%)}
.sum .g div{position:relative}.sum .g img{width:100%;border-radius:8px;display:block}
.sum .g span{position:absolute;left:4px;top:4px;font-family:PX;font-size:7px;padding:3px 4px;background:var(--y);color:#000}
.sum .g span.rep{background:#555;color:#fff}

/* ===== v5 ===== */
#home{justify-content:flex-start;padding:16px 16px 12px;gap:12px;overflow:auto}
.hhead{display:flex;align-items:center;gap:12px;width:100%}
.hhead img{width:44px;cursor:pointer}
.hhead .t{font-family:PX;font-size:14px;color:var(--y);line-height:1.4;text-align:left}
.prog2{width:100%}.prog2 .row{display:flex;justify-content:space-between;font-family:PX;font-size:9px;margin-bottom:6px}
.prog2 .bar{height:10px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.2)}.prog2 .bar i{display:block;height:100%;background:var(--y)}
.goal{font-family:PX;font-size:8px;color:var(--dim);line-height:1.8;text-align:left;width:100%}.goal b{color:var(--y);font-weight:400}
.hpack{width:100%;display:flex;align-items:center;gap:14px;padding:12px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.3);cursor:pointer;text-align:left}
.hpack.ready{border-color:var(--y);background:rgba(255,212,0,.12);box-shadow:0 0 24px rgba(255,212,0,.25)}
.hpack .mini{width:64px;height:92px;flex:none;background:conic-gradient(from 210deg,#ffd400,#ff9edc,#8fe9ff,#c6ff8a,#ffd400);clip-path:polygon(0 5%,10% 0,20% 5%,30% 0,40% 5%,50% 0,60% 5%,70% 0,80% 5%,90% 0,100% 5%,100% 95%,90% 100%,80% 95%,70% 100%,60% 95%,50% 100%,40% 95%,30% 100%,20% 95%,10% 100%,0 95%)}
.hpack.ready .mini{animation:wob 2s ease-in-out infinite}

.hpack b{display:block;font-family:PX;font-size:10px;line-height:1.6;font-weight:400}.hpack span{font-family:PX;font-size:16px;color:var(--y)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.tile{padding:14px 10px;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.25);text-align:left;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.tile b{font-family:PX;font-size:10px;font-weight:400}.tile small{font-family:PX;font-size:7px;color:var(--dim);line-height:1.5}
.tile.lock{opacity:.5}
.dupbox{width:100%;display:flex;align-items:center;gap:10px;justify-content:space-between;font-family:PX;font-size:7px;color:var(--dim);line-height:1.6}
.dupbox button:disabled{opacity:.35}
#test{font-family:PX;font-size:7px;color:#ff6f6f}
/* bienvenida */
.onb{position:fixed;inset:0;z-index:70;background:rgba(5,4,26,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.onb.on{display:flex}
.onb img{width:min(52vw,220px);border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.onb h2{font-family:PX;font-size:16px;color:var(--y);font-weight:400}
.onb p{max-width:300px;line-height:1.5;color:#e6e4f2}
.onb .d{display:flex;gap:6px}.onb .d i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25)}.onb .d i.on{background:var(--y)}
/* álbum */
#pTabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto}

.hud2{width:100%;display:flex;justify-content:space-between;font-family:PX;font-size:9px;color:var(--y)}.hud2 b{color:#fff;font-weight:400}

.hpk{width:170px;aspect-ratio:240/360;display:flex;flex-direction:column;filter:drop-shadow(0 20px 26px rgba(0,0,0,.6))}
.hero.ready .hpk{animation:wob 2.4s ease-in-out infinite}

.hpk-top,.hpk-bot{height:22px;background:repeating-linear-gradient(90deg,#c9a400 0 3px,#ffd400 3px 6px)}
.hpk-top{clip-path:polygon(0 0,5% 25%,10% 0,15% 25%,20% 0,25% 25%,30% 0,35% 25%,40% 0,45% 25%,50% 0,55% 25%,60% 0,65% 25%,70% 0,75% 25%,80% 0,85% 25%,90% 0,95% 25%,100% 0,100% 100%,0 100%)}
.hpk-bot{clip-path:polygon(0 0,100% 0,100% 75%,95% 100%,90% 75%,85% 100%,80% 75%,75% 100%,70% 75%,65% 100%,60% 75%,55% 100%,50% 75%,45% 100%,40% 75%,35% 100%,30% 75%,25% 100%,20% 75%,15% 100%,10% 75%,5% 100%,0 75%)}
.hpk-b{flex:1;position:relative;overflow:hidden;background:linear-gradient(160deg,#1b2a8f,#2f5fd6 45%,#6b3fb8);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:10px}

.hpk-peek img{position:absolute;width:44%;aspect-ratio:480/670;border-radius:5px;box-shadow:0 6px 10px rgba(0,0,0,.5);top:10px}
.hpk-peek img:nth-child(1){left:50%;transform:translateX(-50%);z-index:2;width:50%;top:0}
.hpk-peek img:nth-child(2){left:4%;transform:rotate(-12deg)}.hpk-peek img:nth-child(3){right:4%;transform:rotate(12deg)}
.hpk-l{font-family:PX;font-size:11px;color:var(--y);background:rgba(0,0,0,.6);padding:6px 8px;z-index:1}
.hcta{text-align:center;display:flex;flex-direction:column;gap:6px}
.hcta b{font-family:PX;font-size:9px;font-weight:400;color:#fff}
.hcta span{font-family:PX;font-size:13px;color:var(--y)}
.hero.ready .hcta span{animation:b 1s steps(2) infinite}
.prog3{width:100%}.prog3 .bar{height:8px;background:rgba(255,255,255,.12)}.prog3 .bar i{display:block;height:100%;background:var(--y)}
.prog3 .goal{margin-top:6px;text-align:center}
.dock{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}

/* ===== EFECTOS DE CARTA (foil vivo) ===== */
.fx{position:relative;border-radius:var(--rad,16px);overflow:hidden;isolation:isolate;--mx:50%;--my:50%;--o:0;transform:translateZ(0)}
.fx>img{width:100%;height:100%;display:block;pointer-events:none}
.fx>i{position:absolute;inset:0;pointer-events:none;border-radius:inherit}
.fx .glare{background:radial-gradient(farthest-corner circle at var(--mx) var(--my),rgba(255,255,255,.55) 0,rgba(255,255,255,.12) 25%,rgba(0,0,0,.25) 90%);mix-blend-mode:overlay;opacity:.7}
/* HOLO: bandas finas de arcoíris que se mueven por toda la carta */
.fx.r-holo .foil{
 background:repeating-linear-gradient(110deg,rgba(255,45,111,.9) 0,rgba(255,212,0,.9) 2.2%,rgba(61,255,154,.9) 4.4%,rgba(47,214,255,.9) 6.6%,rgba(176,92,255,.9) 8.8%,rgba(255,45,111,.9) 11%);
 background-size:260% 260%;background-position:var(--mx) var(--my);
 mix-blend-mode:color-dodge;opacity:.32}
/* DORADA: brillo metálico que corre + destellos */
.fx.r-dorada .foil{
 background:
  radial-gradient(circle,rgba(255,255,255,.85) 0 1px,transparent 1.6px) 0 0/11px 11px,
  linear-gradient(115deg,transparent 30%,rgba(255,246,200,.9) 47%,rgba(255,196,40,.5) 52%,transparent 64%) var(--mx) var(--my)/260% 260%;
 mix-blend-mode:overlay;opacity:.9}
.fx.r-dorada::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px rgba(255,224,120,.9),inset 0 0 22px rgba(255,200,60,.45);pointer-events:none}
/* ILUSTRACIÓN: solo destellos finos que se mueven, sin teñir el arte */
.fx.r-full .foil{
 background:
  radial-gradient(circle,#fff 0 .8px,transparent 1.4px) 0 0/13px 17px,
  radial-gradient(circle,#fff 0 .6px,transparent 1.2px) 6px 9px/19px 23px;
 mix-blend-mode:screen;opacity:.0;
 -webkit-mask:radial-gradient(circle at var(--mx) var(--my),#000 0,transparent 38%);mask:radial-gradient(circle at var(--mx) var(--my),#000 0,transparent 38%)}
.fx.r-full .foil{opacity:.75}
.fx.r-comun .foil{display:none}
/* el foil baja sobre la zona de texto para que se lea */
.fx.r-holo .foil{-webkit-mask:linear-gradient(#000 0,#000 52%,rgba(0,0,0,.28) 64%,rgba(0,0,0,.28) 100%);mask:linear-gradient(#000 0,#000 52%,rgba(0,0,0,.28) 64%,rgba(0,0,0,.28) 100%)}
.fx .glare{-webkit-mask:linear-gradient(#000 0,#000 55%,rgba(0,0,0,.4) 68%);mask:linear-gradient(#000 0,#000 55%,rgba(0,0,0,.4) 68%)}
/* movimiento solo cuando nadie la toca */
.fx.idle{animation:fxIdle 5s ease-in-out infinite alternate}
@property --mx{syntax:'<percentage>';inherits:true;initial-value:50%}
@property --my{syntax:'<percentage>';inherits:true;initial-value:50%}
@keyframes fxIdle{0%{--mx:15%;--my:20%}50%{--mx:80%;--my:45%}100%{--mx:35%;--my:85%}}
.sc .fx{--rad:16px;width:100%;height:100%;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.sc:not(.top) .fx{visibility:hidden}
.zoom .fx{--rad:16px;max-height:60vh;aspect-ratio:480/670;height:60vh}

 $('bkSave').onclick=async()=>{const ok=await saveFile(name,txt);bkMsg(ok?'Listo. Si no ves el archivo, usa COPIAR TEXTO.':'No se pudo guardar el archivo. Usa COPIAR TEXTO.',ok?'':'bkwarn')};
 $('bkCopy').onclick=async()=>{const t=$('bkTxt');try{await navigator.clipboard.writeText(txt);bkMsg('Texto copiado.')}
  catch(e){t.focus();t.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}bkMsg(ok?'Texto copiado.':'Selecciona el texto y cópialo a mano.',ok?'':'bkwarn')}}};
$('bkImp').onclick=()=>{beep(880);bkOpen(`<h2>IMPORTAR RESPALDO</h2><p>Elige el archivo .json o pega el texto de tu respaldo.</p>
 <button class="btn y" id="bkPick">ELEGIR ARCHIVO</button><textarea id="bkPaste" placeholder="o pega aquí el texto del respaldo"></textarea>
 <div class="bkb"><button class="btn" id="bkCheck">REVISAR TEXTO</button><button class="btn" data-bkx>CANCELAR</button></div><p id="bkMsg"></p>`);
 $('bkPick').onclick=()=>$('bkFile').click();$('bkCheck').onclick=()=>bkReview($('bkPaste').value)};
$('bkFile').onchange=()=>{const f=$('bkFile').files[0];if(!f)return;if(f.size>1048576){bkMsg('El archivo pesa más de 1 MB; no parece un respaldo.','bkerr');return}
 const r=new FileReader();r.onload=()=>bkReview(String(r.result));r.onerror=()=>bkMsg('No se pudo leer el archivo.','bkerr');r.readAsText(f)};
function bkReview(text){const v=validateBackup(text);if(!v.ok){bkMsg(v.err,'bkerr');beep(150,.2);return}
 syncIn();const m=v.meta,nowC=uniq(),nowR=Object.keys(S.rate).length,d=new Date(m.at),when=isNaN(d)?'fecha desconocida':d.toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'});
 bkOpen(`<h2>¿REEMPLAZAR TU PROGRESO?</h2><p>Respaldo del ${esc(when)}</p>
 <div class="bkcmp"><span></span><span>AHORA</span><span>RESPALDO</span><b>Cartas distintas</b><span>${nowC}</span><span>${m.cards}</span><b>Calificaciones</b><span>${nowR}</span><span>${m.rates}</span><b>Iniciales</b><span>${esc(S.ini||'—')}</span><span>${m.ini||'—'}</span></div>
 ${m.cards<nowC?'<p class="bkwarn">Ojo: el respaldo tiene MENOS cartas que tu progreso actual.</p>':''}
 ${m.pend?`<p>${m.pend} ${m.pend===1?'carta del respaldo todavía no existe':'cartas del respaldo todavía no existen'} en el álbum; se guardan aparte y aparecerán cuando se agreguen.</p>`:''}
 <p>Antes de reemplazar, tu progreso actual se guarda en una copia de seguridad.</p>
 <div class="bkb"><button class="btn y" id="bkOk">REEMPLAZAR MI PROGRESO</button><button class="btn" data-bkx>CANCELAR</button></div><p id="bkMsg"></p>`);
 $('bkOk').onclick=()=>{const r=applyImport(v);if(!r.ok){bkMsg(r.err,'bkerr');beep(150,.2);return}bkClose();claimPend();jingle();toast('¡PROGRESO<br>RESTAURADO!');refresh()}}
/* ---------- compartir (imagen) ---------- */
function drawCover(x,im,dx,dy,dw,dh){const r=Math.max(dw/im.width,dh/im.height),w=dw/r,h=dh/r;x.drawImage(im,(im.width-w)/2,(im.height-h)/2,w,h,dx,dy,dw,dh)}
function li(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
async function deliver(cv,name){const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
 if(STORE.dl){try{await STORE.dl.save({filename:name,data:blob});toast('¡LISTA!');return}catch(e){if(e&&e.code==='declined')return}}
 const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function frame(x,W,H,title){x.fillStyle='#0c0b2a';x.fillRect(0,0,W,H);x.fillStyle='#FFD400';x.font='38px PX';x.textAlign='center';x.fillText(title,W/2,100);
 const lg=await li('logo.png');if(lg)x.drawImage(lg,W/2-60,H-120,120,120*lg.height/lg.width)}
async function shareGrid(title,keys,name){await document.fonts.ready;const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');await frame(x,W,H,title);
 const n=keys.length,cols=n===1?1:3,cw=n===1?560:300,ch=cw*670/480,rows=Math.ceil(n/cols);let y0=(H-rows*ch-(rows-1)*24)/2;
 for(let i=0;i<n;i++){const im=await li('c/'+keys[i]+'.jpg');const row=i/cols|0,inRow=Math.min(cols,n-row*cols),col=i%cols;const x0=(W-inRow*cw-(inRow-1)*24)/2+col*(cw+24);if(im)x.drawImage(im,x0,y0+row*(ch+24),cw,ch)}
 deliver(cv,name)}
async function shareTier(){await document.fonts.ready;const W=1080,cw=96,ch=120,per=9;const m=tierKeys();const rows=TN.map((_,i)=>m.filter(c=>S.rate[c.k]===i));
 const hs=rows.map(r=>Math.max(1,Math.ceil(r.length/per))*(ch+8)+12);const H=Math.max(1350,170+hs.reduce((a,b)=>a+b+12,0)+150);
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');await frame(x,W,H,'MI TIER');let y=150;
 for(let i=0;i<4;i++){x.fillStyle='rgba(255,255,255,.06)';x.fillRect(40,y,W-80,hs[i]);x.fillStyle=TC[i];x.fillRect(40,y,140,hs[i]);x.fillStyle='#000';x.font='22px PX';x.textAlign='center';x.fillText(TN[i],110,y+hs[i]/2+10);
  for(let j=0;j<rows[i].length;j++){const im=await li(artOf(rows[i][j].k));if(im)drawCover(x,im,190+(j%per)*(cw+8),y+8+(j/per|0)*(ch+8),cw,ch)}y+=hs[i]+12}
 deliver(cv,'mi-tier-insertcoinmx.png')}
/* ---------- arranque ---------- */
claimPend();go('home');STORE.init();
