name: QA · Perfil integrado real aislado
on:
  pull_request:
    paths:
      - 'qa/perfil-integrado/**'
      - 'qa/perfil-integrado-browsers.mjs'
      - 'content/auth-account.js'
      - 'content/avatar-profile.js'
      - '.github/workflows/qa-perfil-integrado.yml'
  push:
    branches: [qa/perfil-integrado-real-20261120]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perfil:
    name: Chromium · cuenta, avatar y progreso local
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Instalar Chromium
        run: npx playwright install chromium
      - name: Verificar sintaxis y perfil integrado
        run: |
          node --check content/auth-account.js
          node --check content/avatar-profile.js
          node --check qa/perfil-integrado-browsers.mjs
          node qa/perfil-integrado-browsers.mjs
