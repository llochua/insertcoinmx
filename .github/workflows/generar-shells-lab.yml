name: LAB · generar bases de cartas dinámicas
on:
  push:
    branches:
      - feature/cartas-dinamicas-en-lab
    paths:
      - cartas/generar-shells.py
      - 'cartas/plantillas/**'
      - 'cartas/arte/1up.png'
      - 'cartas/arte/sonic.png'
      - 'cartas/arte/abuket.png'
      - 'cartas/full/sonic.jpg'
      - 'cartas/full/abuket.jpg'
      - .github/workflows/generar-shells-lab.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cartas-dinamicas-lab
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias del generador existente
        run: python -m pip install pillow numpy opencv-python-headless
      - name: Crear solamente las tres muestras del LAB
        run: python cartas/generar-shells.py 1up sonic abuket
      - name: Verificar archivos de cartas del LAB
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          ids=['1up','sonic','abuket']
          files=[Path(folder)/(id + suffix + '.webp')
              for folder in ('cs','cs2') for id in ids
              for suffix in ('','_e','_r')]
          files += [Path(folder)/('F_'+id+'.webp')
              for folder in ('cs','cs2') for id in ('sonic','abuket')]
          assert len(files)==22
          for path in files:
              assert path.is_file(), f'Falta: {path}'
              with Image.open(path) as im:
                  expected=(480,670) if path.parts[0]=='cs' else (960,1340)
                  assert im.size==expected, (str(path), im.size, expected)
          print('22 archivos de muestras, dimensiones válidas; biblioteca antigua intacta.')
          # El interior completo es limpio y legible desde SVG.
          # Los filetes y las esquinas de la plantilla se preservan al píxel.
          import numpy as np
          before=np.asarray(Image.open('cartas/plantillas/marco_dorada.png').convert('RGB'))
          after=np.asarray(Image.open('cs2/sonic_r.webp').convert('RGB'))
          for box in ((30,1220,930,1230),(30,1292,930,1315),(20,1240,50,1289),(911,1240,937,1289)):
              x0,y0,x1,y1=box
              assert np.array_equal(before[y0:y1,x0:x1],after[y0:y1,x0:x1]), f'Contorno alterado: {box}'
          assert not np.array_equal(before[1248:1278,470:570],after[1248:1278,470:570]), 'Texto fijo sin limpiar'
          print('Pie vacío generado; contorno original preservado píxel a píxel.')
          # No debe sobrevivir ninguna línea oscura del antiguo pie:
          # ni borde lateral, ni borde superior/inferior, ni separadores impresos.
          import cv2
          for rareza,archivo in (('comun','1up.webp'),('holo','sonic_e.webp'),
                                 ('dorada','sonic_r.webp')):
              shell=np.asarray(Image.open('cs2/'+archivo).convert('RGB'))
              orig=np.asarray(Image.open('cartas/plantillas/marco_'+rareza+'.png').convert('RGB'))
              region=shell[1237:1289, 48:912]
              oscuro=np.all(region<85,axis=2)
              assert int(oscuro.sum())==0, f'Persisten {oscuro.sum()} pixeles oscuros del pie antiguo en {rareza}'
              antes=orig[1237:1289,48:912]
              assert int(np.all(antes<85,axis=2).sum())>100, f'La referencia de {rareza} no contenia el pie'
              # Marco exterior (extremos del diseño) sin modificaciones.
              assert np.array_equal(shell[1227:1300,0:38],orig[1227:1300,0:38]), rareza+' lado izquierdo'
              assert np.array_equal(shell[1227:1300,922:960],orig[1227:1300,922:960]), rareza+' lado derecho'
          print('Pie antiguo eliminado en Base, Holo y Dorada, sin residuos negros.')
          PY
      - name: Conservar las 22 bases como artefacto de revisión, sin commits automáticos
        uses: actions/upload-artifact@v4
        with:
          name: cartas-dinamicas-bases-lab
          path: |
            cs/*.webp
            cs2/*.webp
          if-no-files-found: error
          retention-days: 14
      - name: Publicar SOLO las 22 bases del LAB aprobadas por integridad
        if: github.event_name == 'push' && github.ref_name == 'feature/cartas-dinamicas-en-lab'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cs/ cs2/
          if ! git diff --cached --quiet; then
            git commit -m "test(lab): replace original footer with clean backing in 22 samples"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
