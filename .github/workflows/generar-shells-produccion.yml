name: Migración · bases dinámicas catálogo completo
on:
  push:
    branches: [feature/cartas-dinamicas-produccion-20261123, release/cartas-dinamicas-mainline-20261123]
    paths:
      - '.github/workflows/generar-shells-produccion.yml'
      - 'cartas/generar-shells.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: generar-shells-produccion
  cancel-in-progress: false
jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias
        run: python -m pip install pillow numpy opencv-python-headless
      - name: Verificar motor dinámico
        run: node --test qa/card-renderer.test.mjs qa/card-data-adapter.test.mjs
      - name: Generar TODAS las bases sin tipografía impresa
        run: python cartas/generar-shells.py --all
      - name: Verificar cobertura del catálogo y las dimensiones
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          import sys
          sys.path.insert(0,'cartas')
          import generar as g
          ds=json.loads(Path('cartas/catalogo.json').read_text(encoding='utf8'))
          aliases=g.leer_fk()
          missing=[]
          count=0
          for d in ds:
              for rarity in ('comun','holo','dorada'):
                  key=d['id'] if d['version_original']==rarity else d['id']+'_'+g.LETRA[rarity]
                  for folder,size in [('cs',(480,670)),('cs2',(960,1340))]:
                      p=Path(folder)/(key+'.webp')
                      if not p.is_file():missing.append(str(p));continue
                      with Image.open(p) as im:
                          if im.size!=size:raise AssertionError((str(p),im.size,size))
                      count+=1
              if d.get('full') and (Path('cartas/full')/(d['id']+'.jpg')).exists():
                  key=aliases.get(d['id'],'F_'+d['id'])
                  for folder,size in [('cs',(480,670)),('cs2',(960,1340))]:
                      p=Path(folder)/(key+'.webp')
                      if not p.is_file():missing.append(str(p));continue
                      with Image.open(p) as im:
                          if im.size!=size:raise AssertionError((str(p),im.size,size))
                      count+=1
          assert not missing,missing[:30]
          assert count>750,count
          print('Todas las bases generadas y verificadas:',count)
          PY
      - name: Publicar bases exclusivamente en rama de integración (no main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cs/ cs2/
          if ! git diff --cached --quiet; then
            git commit -m "build(cards): generar bases sin datos de todo el catálogo"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
