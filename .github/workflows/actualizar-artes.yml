name: Procesar artes nuevas o actualizadas

on:
  push:
    branches-ignore: [main]
    paths:
      - 'cartas/arte/**'
      - 'cartas/full/**'
  workflow_dispatch:
    inputs:
      ids:
        description: 'IDs de diseños a actualizar, separados por espacios'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: regenerar-cartas
  cancel-in-progress: false

jobs:
  actualizar:
    name: Actualizar cartas y generar vista previa
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Obtener rama de trabajo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias oficiales
        run: python -m pip install numpy opencv-python-headless pillow

      - name: Identificar y procesar diseños cambiados
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              ids = event.get("inputs", {}).get("ids", "").replace(",", " ").split()
          else:
              before = event.get("before", "")
              try:
                  if before and before != "0"*40:
                      paths = subprocess.check_output(["git","diff","--name-only",before+"..HEAD"], text=True).splitlines()
                  else:
                      paths = subprocess.check_output(["git","diff","--name-only","HEAD^","HEAD"], text=True).splitlines()
              except subprocess.CalledProcessError as exc:
                  sys.exit("No se pudieron detectar las imágenes cambiadas: "+str(exc))
              ids = []
              for path in paths:
                  match = re.fullmatch(r"cartas/(?:arte|full)/([a-z0-9]+)\.(?:png|jpg)", path)
                  if match:
                      ids.append(match.group(1))
          ids = list(dict.fromkeys(ids))
          if not ids:
              print("No hay fuentes de arte modificadas.")
              sys.exit(0)
          subprocess.run([sys.executable, "cartas/actualizar.py", *ids], check=True)
          subprocess.run([sys.executable, "cartas/qa.py", "--ids", *ids], check=True)
          PY

      - name: Comprobar catálogo y textos
        run: node content/validate.mjs

      - name: Adjuntar hoja de revisión
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cartas-para-revisar
          path: |
            cartas/muestra-cambios.jpg
            cartas/reporte-calidad.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Guardar resultados en la misma rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A c c2 d fa index.html cartas/catalogo.json
          git add -A cartas/arte-manifest.json cartas/muestra-cambios.jpg cartas/reporte-calidad.md || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerar cartas y QA tras actualizar arte"
            git push
          fi
