name: UI system contract

on:
  pull_request:
    paths:
      - "index.html"
      - "content/ui-system.css"
      - "content/design-tokens.css"
      - "content/ui-components.css"
      - "content/artwork-background.css"
      - "content/artwork-background.js"
      - "scripts/check-ui-icons.mjs"
      - "scripts/check-ui-components.mjs"
      - "scripts/check-artwork-background.mjs"
      - "docs/design-system/**"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "content/ui-system.css"
      - "content/design-tokens.css"
      - "content/ui-components.css"
      - "content/artwork-background.css"
      - "content/artwork-background.js"
      - "scripts/check-ui-icons.mjs"
      - "scripts/check-ui-components.mjs"
      - "scripts/check-artwork-background.mjs"

permissions:
  contents: read

jobs:
  ui-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI system without large card assets
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            content/ui-system.css
            content/design-tokens.css
            content/ui-components.css
            content/artwork-background.css
            content/artwork-background.js
            scripts/check-ui-icons.mjs
            scripts/check-ui-components.mjs
            scripts/check-artwork-background.mjs
          sparse-checkout-cone-mode: false
      - name: Verify icon registry and inline scripts
        run: node scripts/check-ui-icons.mjs
      - name: Verify shared component contracts
        run: node scripts/check-ui-components.mjs

      - name: Verify solid illustration background contract DS-ART-01
        run: node scripts/check-artwork-background.mjs
