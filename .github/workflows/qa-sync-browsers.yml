name: QA · Sincronización en dos navegadores

on:
  pull_request:
    branches: [main]
    paths:
      - 'content/cloud-sync.mjs'
      - 'content/auth-account.js'
      - 'content/avatar-profile.js'
      - 'assets/avatars/**'
      - 'qa/profile-browsers.mjs'
      - 'qa/perfil-main-browsers.mjs'
      - 'qa/profile-auth-unit.test.mjs'
      - 'index.html'
      - 'qa/perfil/index.html'
      - 'qa/perfil-preview-browsers.mjs'
      - 'qa/live-experience-browsers.mjs'
      - 'qa/sync-two-browsers.mjs'
      - 'qa/supabase-live-anon.mjs'
      - 'qa/auth-public-settings.mjs'
      - 'qa/live-auth-two-browsers.mjs'
      - 'qa/registro/index.html'
      - '.github/workflows/qa-sync-browsers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-dos-navegadores:
    name: Chromium · dos sesiones · nube simulada
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Playwright fijado
        run: npm install --no-save --no-package-lock playwright@1.56.1

      - name: Instalar Chromium para pruebas
        run: npx playwright install chromium

      - name: Ejecutar sincronización en dos navegadores
        run: node qa/sync-two-browsers.mjs

  qa-perfil-visual:
    name: Mi perfil UX · móvil y escritorio
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Instalar Chromium
        run: npx playwright install chromium
      - name: Verificar onboarding, perfil y protección de cartas
        run: node qa/perfil-preview-browsers.mjs
      - name: Guardar capturas del perfil de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perfil-avatares-capturas
          path: qa/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

  qa-experiencia-publica:
    name: Onboarding y sobres públicos · móvil y escritorio
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Instalar Chromium
        run: npx playwright install chromium
      - name: Probar experiencia pública y proteger progreso
        run: node qa/live-experience-browsers.mjs
      - name: Capturas para revisión de experiencia pública
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiencia-publica-capturas
          path: qa/screenshots/live-experience-*.png
          if-no-files-found: ignore
          retention-days: 7

  qa-perfil-main:
    name: Perfil principal · invitado, cuenta, 12 avatares y colección
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright fijado
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Instalar Chromium
        run: npx playwright install chromium
      - name: Comprobar primera visita, registro, avatar y progreso
        run: |
          node qa/profile-browsers.mjs
          node qa/perfil-main-browsers.mjs

  supabase-anon-smoke:
    name: Supabase real · verificar acceso anónimo
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Comprobar acceso público sin mutaciones
        run: node qa/supabase-live-anon.mjs
      - name: Verificar registro y confirmación por correo en GoTrue
        run: node qa/auth-public-settings.mjs

  auth-real-lectura:
    name: Supabase real · dos sesiones (requiere credenciales)
    if: github.event_name == 'workflow_dispatch' && vars.ICMX_QA_AUTH_TEST_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ICMX_QA_EMAIL: ${{ secrets.ICMX_QA_EMAIL }}
      ICMX_QA_PASSWORD: ${{ secrets.ICMX_QA_PASSWORD }}
    steps:
      - name: Verificar configuración exclusiva de QA
        run: |
          if [ -z "$ICMX_QA_EMAIL" ] || [ -z "$ICMX_QA_PASSWORD" ]; then
            echo '::error::Faltan secretos de cuenta real de laboratorio.'
            exit 1
          fi
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Instalar Chromium
        run: npx playwright install chromium
      - name: Verificar inicio de sesión y recuperación real
        run: node qa/live-auth-two-browsers.mjs
