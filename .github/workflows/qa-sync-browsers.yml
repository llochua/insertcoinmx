name: QA · Sincronización en dos navegadores

on:
  pull_request:
    branches: [main]
    paths:
      - 'content/cloud-sync.mjs'
      - 'index.html'
      - 'qa/sync-two-browsers.mjs'
      - '.github/workflows/qa-sync-browsers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-dos-navegadores:
    name: Chromium · dos sesiones · nube simulada
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Playwright fijado
        run: npm install --no-save --no-package-lock playwright@1.56.1

      - name: Instalar Chromium para pruebas
        run: npx playwright install --with-deps chromium

      - name: Ejecutar dos navegadores independientes
        run: node qa/sync-two-browsers.mjs
