name: Preparar rama limpia para cartas dinámicas
on:
  push:
    branches: [feature/cartas-dinamicas-produccion-20261123]
    paths: ['.github/workflows/preparar-card-release.yml']
permissions:
  contents: write
jobs:
  fusionar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Integrar trabajo sobre main actual preservando ambos historiales
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main feature/cartas-dinamicas-produccion-20261123
          git checkout -B release/cartas-dinamicas-mainline-20261123 origin/main
          if ! git merge --no-commit --no-ff origin/feature/cartas-dinamicas-produccion-20261123; then
            echo "Conflictos detectados, resolver solo index desde rama de renderer y resto desde main"
            while IFS= read -r -d '' file; do
              case "$file" in
                index.html) git checkout --theirs -- "$file";;
                *) git checkout --ours -- "$file";;
              esac
              git add -- "$file"
            done < <(git diff --name-only --diff-filter=U -z)
          fi
          if test -n "$(git diff --name-only --diff-filter=U)"; then
            echo "ERROR: quedaron archivos en conflicto";exit 1
          fi
          test -f content/card-runtime.js
          test -f cs2/1up.webp
          test -f cs/virtual.webp
          grep -q ICMX_CARD_RUNTIME index.html
          grep -q ART_BG_GENERATED index.html
          grep -q "const PRUEBA=false;" index.html
          node --check content/card-runtime.js
          git commit -m "release(cards): integrar estructura dinámica sobre main conservando diseños"
          git push origin HEAD:refs/heads/release/cartas-dinamicas-mainline-20261123
