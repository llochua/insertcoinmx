name: QA · Avatar de cuenta real (interfaz aislada)
on:
  pull_request:
    paths:
      - 'qa/avatar-cuenta/**'
      - 'qa/avatar-account-browsers.mjs'
      - '.github/workflows/qa-avatar-account.yml'
  push:
    branches: [qa/avatar-cuenta-real-20261120]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avatar-cuenta:
    name: Chromium · sesión simulada y 12 avatares
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Instalar Chromium
        run: npx playwright install chromium
      - name: Verificar sintaxis y recorrido completo simulado
        run: |
          node --check qa/avatar-account-browsers.mjs
          node qa/avatar-account-browsers.mjs
