name: QA · Invitado verificado con Auth real
on:
  pull_request:
    branches: [main]
    paths:
      - 'qa/verified-guest/**'
      - 'content/verified-guest.mjs'
      - 'content/cloud-sync.mjs'
      - 'content/auth-account.js'
      - 'supabase/sql/**'
      - '.github/workflows/qa-verified-guest.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guest-auth-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Configurar Auth de invitado exclusivamente local
        run: |
          npm install --no-save --no-package-lock @supabase/supabase-js@2.95.3
          mkdir -p "$RUNNER_TEMP/guest-local"
          cd "$RUNNER_TEMP/guest-local"
          supabase init
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('supabase/config.toml')
          s=p.read_text()
          for key in ['enable_anonymous_sign_ins','enable_manual_linking','enable_confirmations']:
              s,n=re.subn(r'(?m)^'+key+r'\s*=\s*false\s*$',key+' = true',s)
              assert n>0 or re.search(r'(?m)^'+key+r'\s*=\s*true\s*$',s),key
          s,n=re.subn(r'(?m)^anonymous_users\s*=\s*\d+\s*$', 'anonymous_users = 10', s)
          assert n==1, 'anonymous_users'
          p.write_text(s)
          PY
          supabase start
      - name: Probar gate, emisión, confirmación de correo y recuperación
        run: |
          cd "$RUNNER_TEMP/guest-local"
          set -a
          eval "$(supabase status -o env)"
          set +a
          cd "$GITHUB_WORKSPACE"
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f qa/verified-guest/local-fixture.sql
          sleep 2
          node qa/verified-guest/local-auth.mjs --closed
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "update private_sync.beta_access_gate set enabled=true where key='verified_guest'"
          node qa/verified-guest/local-auth.mjs
          admitted=$(psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -Atc "select admitted from private_sync.guest_admission_daily where utc_day=(clock_timestamp() AT TIME ZONE 'UTC')::date")
          test "$admitted" = 101
          echo 'PASS: 101 admissions, no duplicate increments, no global cap'
      - name: Destruir instancia desechable
        if: always()
        run: |
          cd "$RUNNER_TEMP/guest-local"
          supabase stop --no-backup
