name: QA · Ranking POP aislado
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ranking-test-only
          POSTGRES_DB: ranking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Motor y cliente de ranking
        run: node --test qa/community-value.test.mjs qa/community-ranking.test.mjs qa/value-screens.test.mjs
      - name: Base de datos desechable · dos identidades y permisos
        env:
          PGPASSWORD: ranking-test-only
        run: psql -h localhost -U postgres -d ranking_test -v ON_ERROR_STOP=1 -f qa/community-pop-isolated.sql
      - name: Instalar Chromium para las dos sesiones de prueba
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Ranking y POP en navegadores aislados
        run: node qa/community-ranking-browsers.mjs
      - name: Capturas móvil y escritorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranking-pop-capturas
          path: qa/screenshots/global-pop-*.png
          if-no-files-found: ignore
