name: Validación básica

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Cartas y sintaxis JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Comprobar sintaxis JavaScript
        run: |
          node --check reta-diaria.js
          node --check content/card-texts.js
          node --check content/validate.mjs
          node --check content/cloud-sync.mjs

      - name: Probar sincronización segura
        run: |
          node --test content/cloud-sync.test.mjs content/cloud-restore.test.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html','utf8');
          let count=0;
          for(const match of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)){
            if(!match[1].trim()||/type=[\"']application\/ld\+json[\"']/.test(match[0].split('>')[0]))continue;
            new vm.Script(match[1],{filename:'index.html (inline)'});
            count++;
          }
          if(!count)throw Error('No se hallaron scripts en index.html');
          console.log('Scripts inline válidos: '+count);
          NODE

      - name: Validar catálogo y narrativas
        run: node content/validate.mjs


  qa-sincronizacion:
    name: QA · dos navegadores Chromium (rama de pruebas)
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/sync-automatica-segura-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Playwright fijado
        run: npm install --no-save --no-package-lock playwright@1.56.1

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Probar dos dispositivos aislados
        run: node qa/sync-two-browsers.mjs
