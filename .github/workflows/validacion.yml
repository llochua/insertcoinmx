name: Validación de cartas y artes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/perfil-avatar-persistente-20261120]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Catálogo, integridad de imágenes y UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código y base de comparación
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librería de imágenes
        run: python -m pip install pillow

      - name: Comprobar sintaxis JavaScript y Python
        run: |
          node --check reta-diaria.js
          node --check content/card-texts.js
          node --check content/validate.mjs
          node --check content/cloud-sync.mjs
          node --check content/auth-account.js
          node --check content/avatar-profile.js
          node --check qa/profile-browsers.mjs
          node --check qa/profile-auth-unit.test.mjs
          node --check qa/live-auth-two-browsers.mjs
          node --check qa/live-experience-browsers.mjs
          python -m py_compile cartas/generar.py cartas/actualizar.py cartas/qa.py

      - name: Probar sincronización segura
        run: |
          node --test content/cloud-sync.test.mjs content/cloud-restore.test.mjs qa/registro/cloud-snapshot.test.mjs
          node --test qa/profile-auth-unit.test.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html','utf8');
          let count=0;
          for(const match of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)){
            if(!match[1].trim()||/type=[\"']application\/ld\+json[\"']/.test(match[0].split('>')[0]))continue;
            new vm.Script(match[1],{filename:'index.html (inline)'});
            count++;
          }
          if(!count)throw Error('No se hallaron scripts en index.html');
          const registration=fs.readFileSync('qa/registro/index.html','utf8');
          const moduleScript=registration.split('<script type="module">')[1]?.split('</script>')[0];
          if(!moduleScript)throw Error('No se halló el script de registro');
          const {spawnSync}=require('node:child_process');
          const checked=spawnSync(process.execPath,['--check','--input-type=module'],{input:moduleScript,encoding:'utf8'});
          if(checked.status!==0)throw Error(checked.stderr);
          console.log('Módulo de registro válido');
          console.log('Scripts inline válidos: '+count);
          NODE

      - name: Validar catálogo, narrativas y seguridad beta
        run: |
          node content/validate.mjs
          node qa/check-server-pack-pool.mjs
          node qa/check-beta-gate.mjs

      - name: Probar actualización completa de una carta sin publicarla
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install numpy opencv-python-headless
          python cartas/actualizar.py sonic

      - name: Verificar imágenes y tratamiento visual
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python cartas/qa.py --changed --base "$(git merge-base HEAD origin/main)"
          else
            python cartas/qa.py --all
          fi
