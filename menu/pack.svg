<svg xmlns="http://www.w3.org/2000/svg" width="480" height="670" viewBox="0 0 480 670" role="img" aria-label="Sobre abierto con cartas coleccionables emergiendo">
<defs>
 <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#43162D"/><stop offset="1" stop-color="#170E2C"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#FB794D" stop-opacity=".63"/><stop offset=".52" stop-color="#FB794D" stop-opacity=".24"/><stop offset="1" stop-color="#FB794D" stop-opacity="0"/></radialGradient>
 <filter id="shade" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="22" stdDeviation="16" flood-color="#05030b" flood-opacity=".55"/></filter>
 <linearGradient id="paper" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFF9E9"/><stop offset=".45" stop-color="#E9E0CE"/><stop offset="1" stop-color="#ACA8A4"/></linearGradient>
 <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF9C5"/><stop offset=".4" stop-color="#FFD344"/><stop offset=".8" stop-color="#EFA91D"/><stop offset="1" stop-color="#9C5318"/></linearGradient>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C9FFF8"/><stop offset=".55" stop-color="#5CEAD4"/><stop offset="1" stop-color="#078DAD"/></linearGradient>
 <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE6E2"/><stop offset=".45" stop-color="#FF7595"/><stop offset="1" stop-color="#BD2B5F"/></linearGradient>
 <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF9A5"/><stop offset=".25" stop-color="#B8C7FF"/><stop offset=".52" stop-color="#EEBBF9"/><stop offset=".78" stop-color="#9EF4ED"/><stop offset="1" stop-color="#FFDE9C"/></linearGradient>
</defs>
<rect width="480" height="670" rx="18" fill="url(#scene)"/>
<ellipse cx="240" cy="280" rx="280" ry="300" fill="url(#aura)"/>

