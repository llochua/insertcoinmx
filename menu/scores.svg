 <radialGradient id="aura"><stop stop-color="#298B7F" stop-opacity=".63"/><stop offset=".52" stop-color="#298B7F" stop-opacity=".24"/><stop offset="1" stop-color="#298B7F" stop-opacity="0"/></radialGradient>
 <filter id="shade" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="22" stdDeviation="16" flood-color="#05030b" flood-opacity=".55"/></filter>
 <linearGradient id="paper" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFF9E9"/><stop offset=".45" stop-color="#E9E0CE"/><stop offset="1" stop-color="#ACA8A4"/></linearGradient>
