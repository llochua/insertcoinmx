<path d="M47 327h81v69H47Z" fill="#7AC9F1"/>
<text x="86" y="377" font-size="49" fill="#153051" text-anchor="middle">B</text>
<rect x="153" y="338" width="55" height="50" rx="5" fill="#142238" stroke="#80C7EE" stroke-width="3"/>
<path d="m180 350 13 25h-26Z" fill="#92DEFF"/>
