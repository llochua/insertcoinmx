<rect x="219" y="255" width="55" height="50" rx="5" fill="#241736" stroke="#FFA7CF" stroke-width="3"/>
<path d="m180 269 14 13-14 12-14-12Z" fill="#F3B5DE"/>
<path d="M245 263v32m-16-16h32" stroke="#EBC7EA" stroke-width="6"/>
